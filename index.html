<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智学探索</title>
  <meta name="theme-color" content="#2B6CB0">
  <meta name="description" content="AI 驱动的全学科学习工具">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="智学探索">
  <meta name="application-name" content="智学探索">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app"></div>
  <footer class="site-footer">AI 学习助手 · 探索知识，触手可及</footer>

  <button id="ai-fab" class="ai-fab" type="button" aria-label="打开 AI 助手">AI</button>
  <div id="ai-drawer" class="ai-drawer" hidden>
    <div id="ai-drawer-mask" class="ai-drawer-mask"></div>
    <aside class="ai-drawer-panel" role="dialog" aria-modal="true" aria-label="AI 助手">
      <header class="ai-drawer-head">
        <span>AI 助手</span>
        <button id="ai-drawer-close" class="ai-drawer-close" type="button" aria-label="关闭">×</button>
      </header>
      <iframe id="ai-frame" class="ai-frame" title="AI 助手"></iframe>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/knowledge.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 仅通过 http(s) 访问时注册 Service Worker（file:// 不支持）
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
