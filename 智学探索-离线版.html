  <style>
:root {
  --primary: #2B6CB0;
  --bg: #ffffff;
  --card-bg: #F7FAFC;
  --border: #E2E8F0;
  --text: #1A202C;
  --muted: #718096;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app {
  max-width: 920px;
  margin: 0 auto;
  padding: 56px 24px 24px;
}

.site-footer {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 24px 32px;
  text-align: center;
  font-size: 12px;
  line-height: 1.8;
  color: var(--muted);
}

/* AI 悬浮按钮与抽屉 */
.ai-fab {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 40;
  width: 52px;
  height: 52px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: var(--primary);
  color: #ffffff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(43, 108, 176, 0.28);
}

.ai-fab:hover {
  background: #24598f;
}

body.ai-drawer-open {
  overflow: hidden;
}

.ai-drawer {
  position: fixed;
  inset: 0;
  z-index: 60;
}

.ai-drawer[hidden] {
  display: none;
}

.ai-drawer-mask {
  position: absolute;
  inset: 0;
  background: rgba(26, 32, 44, 0.35);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.ai-drawer-panel {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 400px;
  max-width: 85%;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform 0.2s ease;
}

.ai-drawer.is-open .ai-drawer-mask {
  opacity: 1;
}

.ai-drawer.is-open .ai-drawer-panel {
  transform: translateX(0);
}

.ai-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 600;
}

.ai-drawer-close {
  width: 30px;
  height: 30px;
  padding: 0;
  border: none;
  background: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
}

.ai-drawer-close:hover {
  color: var(--text);
}

.ai-frame {
  flex: 1;
  width: 100%;
  border: 0;
}

/* 首页 */
.home-head {
  margin-bottom: 36px;
  text-align: center;
}

.home-head h1 {
  margin: 0 0 10px;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: 1px;
}

.home-head p {
  margin: 0;
  font-size: 14px;
  color: var(--muted);
}

.home-head .home-tagline {
  margin-top: 6px;
  font-size: 13px;
}

.home-head .home-stat {
  margin-top: 14px;
  font-size: 12px;
  letter-spacing: 0.3px;
  color: var(--muted);
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.subject-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 18px;
  min-height: 104px;
  padding: 20px 18px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: inherit;
  text-decoration: none;
  transition: border-color 0.15s ease, background-color 0.15s ease;
}

@media (hover: hover) {
  .subject-card:hover {
    border-color: var(--primary);
    background: #F0F5FA;
  }
}

.subject-card:active {
  background: #EDF3F9;
}

.subject-card:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.subject-card .name {
  font-size: 20px;
  font-weight: 600;
}

.subject-card .en {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.home-actions {
  display: flex;
  justify-content: center;
  margin-top: 28px;
}

.home-random {
  height: 42px;
  padding: 0 26px;
  border: 1px solid var(--primary);
  border-radius: 999px;
  background: #ffffff;
  color: var(--primary);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.home-random:hover {
  background: var(--primary);
  color: #ffffff;
}

.home-random:active {
  background: #24598f;
  border-color: #24598f;
  color: #ffffff;
}

.home-random:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

/* 学科页 */
.back-link {
  flex-shrink: 0;
  font-size: 14px;
  color: var(--primary);
  text-decoration: none;
}

.back-link:hover {
  text-decoration: underline;
}

.question-input {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0 14px;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.question-input:focus {
  outline: none;
  border-color: var(--primary);
}

.question-input.is-shaking {
  animation: input-shake 0.3s ease-in-out;
}

@keyframes input-shake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-4px);
  }
  75% {
    transform: translateX(4px);
  }
}

.primary-btn {
  flex-shrink: 0;
  height: 44px;
  padding: 0 24px;
  font-family: inherit;
  font-size: 15px;
  color: #ffffff;
  background: var(--primary);
  border: 1px solid var(--primary);
  border-radius: 8px;
  cursor: pointer;
}

.primary-btn:hover {
  background: #255a94;
}

.primary-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.answer-card {
  min-height: 120px;
  padding: 20px;
  margin-bottom: 20px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.answer-body {
  margin: 0;
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}

.answer-body.muted {
  color: var(--muted);
}

.answer-notice {
  margin: 0 0 14px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
  text-align: left;
}

.answer-source {
  margin: 16px 0 0;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  font-size: 12px;
  color: var(--muted);
  text-align: right;
}

.answer-loading {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 15px;
}

.loading-dots {
  display: inline-flex;
  gap: 4px;
}

.loading-dots span {
  width: 5px;
  height: 5px;
  background: var(--muted);
  border-radius: 50%;
  animation: dot-jump 1.2s infinite ease-in-out;
}

.loading-dots span:nth-child(2) {
  animation-delay: 0.15s;
}

.loading-dots span:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes dot-jump {
  0%,
  60%,
  100% {
    transform: translateY(0);
    opacity: 0.4;
  }
  30% {
    transform: translateY(-3px);
    opacity: 1;
  }
}

.poem-answer {
  text-align: center;
  white-space: normal;
}

.poem-title {
  margin: 4px 0 8px;
  font-size: 22px;
  font-weight: 600;
}

.poem-meta {
  margin: 0 0 22px;
  font-size: 14px;
  color: var(--muted);
}

.author-link {
  color: var(--primary);
  text-decoration: none;
}

.author-link:hover {
  text-decoration: underline;
}

.poem-line {
  margin: 0;
  padding: 6px 0;
  font-size: 17px;
  line-height: 1.9;
}

.poem-pinyin {
  display: block;
  margin-bottom: 2px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
  letter-spacing: 0.5px;
}

.poem-pinyin[hidden] {
  display: none;
}

.action-area {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.action-btn {
  height: 38px;
  padding: 0 16px;
  font-family: inherit;
  font-size: 14px;
  color: #A0AEC0;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: not-allowed;
}

.action-btn:not(:disabled) {
  color: var(--primary);
  background: #ffffff;
  border-color: var(--primary);
  cursor: pointer;
}

.action-btn:not(:disabled):hover {
  background: #F0F5FA;
}

/* 二级详情页 */
.topbar {
  margin-bottom: 32px;
}

.back-btn {
  padding: 0;
  font-family: inherit;
  font-size: 14px;
  color: var(--primary);
  background: none;
  border: none;
  cursor: pointer;
}

.back-btn:hover {
  text-decoration: underline;
}

.detail-card {
  padding: 32px 24px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.detail-nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 10px;
  margin-top: 18px;
}

.detail-nav-btn {
  min-width: 0;
  color: var(--primary);
  font-size: 13px;
  text-decoration: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.detail-nav-btn:last-child {
  text-align: right;
}

.detail-nav-btn.is-disabled {
  color: var(--muted);
}

.detail-nav-index {
  font-size: 12px;
  color: var(--muted);
}

.detail-title {
  margin: 0 0 6px;
  font-size: 22px;
  font-weight: 600;
}

.detail-meta {
  margin: 0 0 30px;
  font-size: 13px;
  color: var(--muted);
}

.detail-text {
  margin: 0;
  font-size: 15px;
  line-height: 1.9;
  color: var(--muted);
}

.detail-empty {
  margin: 0;
  padding: 48px 0;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

.detail-section {
  margin-top: 28px;
}

.detail-section h3 {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 600;
  color: var(--primary);
}

.detail-section p {
  margin: 0;
  font-size: 15px;
  line-height: 1.9;
}

.detail-section .info-list {
  margin-top: 10px;
  gap: 12px;
}

.pattern-lines {
  margin-top: 8px;
}

.pattern-lines .pattern-line {
  margin: 0 0 8px;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  font-size: 14px;
  line-height: 1.9;
  white-space: nowrap;
  overflow-x: auto;
}

.pattern-lines .pattern-line:last-child {
  margin-bottom: 0;
}

.example-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 10px;
}

.example-item .example-en {
  margin: 0;
  font-size: 15px;
  line-height: 1.8;
}

.example-item .example-zh {
  margin: 4px 0 0;
  font-size: 13px;
  line-height: 1.8;
  color: var(--muted);
}

.detail-section .mnemonic {
  margin: 10px 0 0;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.8;
  color: var(--primary);
  letter-spacing: 0.04em;
}

.line-pairs {
  display: flex;
  flex-direction: column;
  gap: 26px;
}

.line-src {
  margin: 0 0 6px;
  font-size: 13px;
  line-height: 1.8;
  color: var(--muted);
}

.line-trans {
  margin: 0;
  font-size: 16px;
  line-height: 1.9;
}

.info-list {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-top: 24px;
}

.info-row {
  display: flex;
  gap: 16px;
}

.info-label {
  flex-shrink: 0;
  width: 76px;
  font-size: 14px;
  line-height: 1.9;
  color: var(--muted);
}

.info-value {
  font-size: 15px;
  line-height: 1.9;
}

/* 数学二级页 */
.formula-list {
  display: flex;
  flex-direction: column;
}

.formula-item {
  padding: 28px 0;
}

.formula-item:first-child {
  padding-top: 12px;
}

.formula-item + .formula-item {
  border-top: 1px solid var(--border);
}

.formula-latex {
  margin-bottom: 10px;
  font-size: 1.25rem;
  line-height: 1.6;
  overflow-x: auto;
  overflow-y: hidden;
}

.formula-desc {
  margin: 0;
  font-size: 13px;
  line-height: 1.7;
  color: var(--muted);
}

.step-item {
  margin-top: 30px;
}

.step-item:first-of-type {
  margin-top: 10px;
}

.step-title {
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 600;
}

.step-content {
  margin: 0;
  font-size: 15px;
  line-height: 1.9;
}

/* 地理关系图 */
.diagram-card {
  padding: 20px 20px 16px;
  margin-bottom: 20px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.diagram-title {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 600;
}

.geo-svg {
  display: block;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}

.geo-link {
  stroke: #A0AEC0;
  stroke-width: 0.6;
}

.geo-link-label {
  fill: var(--muted);
  text-anchor: middle;
  paint-order: stroke;
  stroke: #ffffff;
  stroke-width: 1.4;
}

.geo-node {
  cursor: pointer;
}

.geo-node rect {
  fill: var(--card-bg);
  stroke: #CBD5E0;
  stroke-width: 0.6;
}

.geo-node:hover rect,
.geo-node:focus-visible rect {
  fill: #F0F5FA;
  stroke: var(--primary);
}

.geo-node:focus {
  outline: none;
}

.geo-node text {
  fill: var(--text);
  font-family: inherit;
}

.diagram-hint {
  margin: 10px 0 0;
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

.geo-popup {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(26, 32, 44, 0.35);
}

.geo-popup[hidden] {
  display: none;
}

.geo-popup-card {
  position: relative;
  width: 100%;
  max-width: 360px;
  padding: 24px 22px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.geo-popup-card h3 {
  margin: 0 0 8px;
  font-size: 18px;
  font-weight: 600;
}

.geo-popup-card p {
  margin: 0;
  font-size: 14px;
  line-height: 1.8;
  color: var(--muted);
}

.geo-popup-close {
  position: absolute;
  top: 8px;
  right: 10px;
  width: 30px;
  height: 30px;
  padding: 0;
  font-family: inherit;
  font-size: 20px;
  line-height: 1;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
}

.geo-popup-close:hover {
  color: var(--text);
}

.numbered-list {
  margin: 10px 0 0;
  padding-left: 22px;
}

.numbered-list li {
  margin-bottom: 12px;
  padding-left: 2px;
  font-size: 15px;
  line-height: 1.9;
}

.numbered-list li::marker {
  color: var(--primary);
  font-weight: 600;
}

.rxn-cond {
  font-size: 0.85em;
  color: var(--muted);
}

@media (min-width: 700px) {
  .subject-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
}

@media (max-width: 480px) {
  .app {
    padding: 36px 16px 20px;
  }

  .site-footer {
    padding: 0 16px 24px;
  }

  .ai-fab {
    right: 16px;
    bottom: 16px;
  }

  .formula-latex {
    font-size: 1.05rem;
  }

  .home-head h1 {

/* ========= 历史记录抽屉 ========= */
.subject-head {

}

}

}

.history-btn {
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 34px;
  padding: 0 12px;
  font-family: inherit;
  font-size: 13px;
  color: var(--muted);
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 17px;
  cursor: pointer;
}

.history-btn:hover {
  color: var(--primary);
  border-color: var(--primary);
}

.history-btn-ico {
  font-size: 14px;
}

body.history-drawer-open,
body.ai-drawer-open {
  overflow: hidden;
}

.history-drawer {
  position: fixed;
  inset: 0;
  z-index: 60;
}

.history-drawer[hidden] {
  display: none;
}

.history-drawer-mask {
  position: absolute;
  inset: 0;
  background: rgba(26, 32, 44, 0.35);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.history-drawer-panel {
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 360px;
  max-width: 88%;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-right: 1px solid var(--border);
  transform: translateX(-100%);
  transition: transform 0.2s ease;
}

.history-drawer.is-open .history-drawer-mask {
  opacity: 1;
}

.history-drawer.is-open .history-drawer-panel {
  transform: translateX(0);
}

.history-drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 600;
  flex-shrink: 0;
}

.history-drawer-close {
  width: 30px;
  height: 30px;
  padding: 0;

  background: none;
  color: var(--muted);
  font-family: inherit;
  font-size: 20px;
  line-height: 1;

}

.history-drawer-body {

}

}

}

}

}

}

/* 首页按钮悬浮说明 */
.has-tip {
  position: relative;
}

.has-tip::after {
  content: attr(data-tip);
  position: absolute;
  left: 50%;
  bottom: calc(100% + 10px);
  z-index: 30;
  width: max-content;
  max-width: 220px;
  padding: 7px 10px;
  border-radius: 6px;
  background: rgba(34, 47, 62, 0.94);
  color: #ffffff;
  font-size: 12px;
  line-height: 1.5;
  text-align: center;
  white-space: normal;
  opacity: 0;
  visibility: hidden;
  transform: translate(-50%, 4px);
  transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
  pointer-events: none;
}

.has-tip::before {
  content: '';
  position: absolute;
  left: 50%;
  bottom: calc(100% + 4px);
  z-index: 30;
  border: 6px solid transparent;
  border-top-color: rgba(34, 47, 62, 0.94);
  opacity: 0;
  visibility: hidden;
  transform: translateX(-50%);
  transition: opacity 0.15s ease, visibility 0.15s;
  pointer-events: none;
}

.has-tip:hover::after,
.has-tip:focus-visible::after,
.has-tip:hover::before,
.has-tip:focus-visible::before {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

.has-tip:hover::before,
.has-tip:focus-visible::before {
  transform: translateX(-50%);
}

/* 触屏设备不显示悬浮提示，避免点按后残留 */
@media (hover: none) {
  .has-tip::after,
  .has-tip::before {
    display: none;
  }
}

<script>
const AI_CONFIG = {
  enabled: false,
  unitId: '',
  robotId: '',
  chatUrl: ''
};

// 共享知识库后端地址。
// 留空表示自动判断：同源部署直接用当前域名；本地 file:// 或 8000 端口预览时连 localhost:3000。

<script>
/* 智学探索 · 本地知识库存储层（IndexedDB，失败时退回 localStorage） */
const KnowledgeStore = (() => {
  const DB_NAME = 'zhixue_knowledge';
  const STORE = 'entries';
  const VERSION = 1;
  const LS_KEY = 'zhixue_learned_v1';

  let dbPromise = null;
  let useFallback = false;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve) => {
      if (typeof indexedDB === 'undefined') {
        useFallback = true;
        resolve(null);
        return;
      }
      let req;
      try {
        req = indexedDB.open(DB_NAME, VERSION);
      } catch {
        useFallback = true;
        resolve(null);
        return;
      }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const store = db.createObjectStore(STORE, { keyPath: 'id' });
          store.createIndex('subject', 'subject', { unique: false });
          store.createIndex('updatedAt', 'updatedAt', { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => {
        useFallback = true;
        resolve(null);
      };
    });
    return dbPromise;
  }

  function readLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch {
      return [];
    }
  }

  function writeLocal(list) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(list));
    } catch {
      // 容量不足时丢弃最旧的记录
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(list.slice(-80)));
      } catch {
        // 放弃写入
      }
    }
  }

  async function getAll() {
    const db = await openDb();
    if (!db) return readLocal();
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => resolve(Array.isArray(req.result) ? req.result : []);
        req.onerror = () => resolve(readLocal());
      } catch {
        resolve(readLocal());
      }
    });
  }

  async function put(entry) {
    const db = await openDb();
    if (!db) {
      const list = readLocal().filter((item) => item.id !== entry.id);
      list.push(entry);
      writeLocal(list);
      return true;
    }
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(entry);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch {
        resolve(false);
      }
    });
  }

  async function remove(id) {
    const db = await openDb();
    if (!db) {
      writeLocal(readLocal().filter((item) => item.id !== id));
      return true;
    }
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch {
        resolve(false);
      }
    });
  }

  async function putAll(entries) {
    const db = await openDb();
    if (!db) {
      const map = new Map(readLocal().map((item) => [item.id, item]));
      entries.forEach((item) => map.set(item.id, item));
      writeLocal([...map.values()]);
      return true;
    }
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(STORE, 'readwrite');
        const store = tx.objectStore(STORE);
        entries.forEach((item) => store.put(item));
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      } catch {
        resolve(false);
      }
    });
  }

  return { getAll, put, putAll, remove, isFallback: () => useFallback };
})();

if (typeof window !== 'undefined') {
  window.KnowledgeStore = KnowledgeStore;
}

<script>
/* 智学探索 · 知识库：联网学到的内容在此去重、归档、离线复用 */
const Knowledge = (() => {
  const MAX_ENTRIES = 800;
  let cache = [];
  let readyPromise = null;

  function normalize(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/\s+/g, '')
      .replace(/[，。！？、；：""''（）()【】\[\]?!.,;:'"`~—…·]/g, '');
  }

  function hash(text) {
    let h = 5381;
    for (let i = 0; i < text.length; i += 1) {
      h = ((h << 5) + h + text.charCodeAt(i)) >>> 0;
    }
    return h.toString(36);
  }

  function makeId(subject, question) {
    return 'learn-' + subject + '-' + hash(normalize(question));
  }

  function isValid(entry) {
    return (
      entry &&
      entry.id &&
      entry.subject &&
      (entry.question || entry.title) &&
      typeof entry.answer === 'string' &&
      entry.answer.trim().length > 0
    );
  }

  function sanitize(entry) {
    return {
      keywords: [],
      hits: 0,
      pinned: false,
      learnedAt: Date.now(),
      updatedAt: Date.now(),
      source: '',
      sourceUrl: '',
      auto: true,
      ...entry
    };
  }

  function sortCache() {
    cache.sort(
      (a, b) =>
        (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) ||
        (b.updatedAt || 0) - (a.updatedAt || 0)
    );
  }

  async function init() {
    if (readyPromise) return readyPromise;
    readyPromise = (async () => {
      const list = await KnowledgeStore.getAll();
      cache = list.filter(isValid).map(sanitize);
      sortCache();
      return cache;
    })();
    return readyPromise;
  }

  function list(subjectId) {
    return subjectId ? cache.filter((item) => item.subject === subjectId) : cache.slice();
  }

  const STOP_WORDS = /(为什么|是什么|怎么样|怎么|如何|请问|多少|什么|哪些|告诉我|原因|一下|的|了|吗|呢|吧|啊|呀|是|有|和|与|及|请)/g;

  function core(text) {
    return normalize(text).replace(STOP_WORDS, '');
  }

  function bigramSimilarity(a, b) {
    if (!a || !b) return 0;
    const grams = (text) => {
      const set = new Set();
      for (let i = 0; i < text.length - 1; i += 1) set.add(text.slice(i, i + 2));
      return set;
    };
    const ga = grams(a);
    const gb = grams(b);
    if (!ga.size || !gb.size) return 0;
    let hit = 0;
    ga.forEach((g) => {
      if (gb.has(g)) hit += 1;
    });
    return hit / Math.min(ga.size, gb.size);
  }

  function find(subjectId, question) {
    const q = normalize(question);
    if (!q || q.length < 2) return null;

    let best = null;
    let bestScore = 0;

    cache.forEach((entry) => {
      if (subjectId && entry.subject !== subjectId) return;
      let score = 0;
      const nq = normalize(entry.question || '');
      const nt = normalize(entry.title || '');

      if (nq && nq === q) score = 10;
      else if (nt && nt === q) score = 9;
      else if (nq && Math.min(nq.length, q.length) >= 2 && (nq.includes(q) || q.includes(nq))) score = 6;
      else if (nt && Math.min(nt.length, q.length) >= 2 && (nt.includes(q) || q.includes(nt))) score = 5;

      if (!score && Array.isArray(entry.keywords)) {
        entry.keywords.forEach((k) => {
          const nk = normalize(k);
          if (!nk || nk.length < 2) return;
          if (nk === q) score = Math.max(score, 5);
          else if (nk.includes(q) || q.includes(nk)) score = Math.max(score, 4);
        });
      }

      // 去掉疑问词后的核心词对比：如「潮汐形成原因」命中「潮汐是怎么形成的」
      if (!score) {
        const cq = core(question);
        const cnq = core(entry.question || '');
        const cnt = core(entry.title || '');
        if (cq && cq.length >= 2) {
          if (cnq && cnq === cq) score = 8;
          else if (cnt && cnt === cq) score = 7;
          else if (cnq && (cnq.includes(cq) || cq.includes(cnq))) score = 5;
          else if (cnt && (cnt.includes(cq) || cq.includes(cnt))) score = 4;
        }
        if (!score && q.length >= 4) {
          const sim = Math.max(bigramSimilarity(cq, cnq), bigramSimilarity(cq, cnt));
          if (sim >= 0.75) score = 7;
          else if (sim >= 0.5) score = 3;
        }
      }

      if (score > bestScore) {
        bestScore = score;
        best = entry;
      }
    });

    if (!best) return null;

    best.hits = (best.hits || 0) + 1;
    best.lastUsedAt = Date.now();
    KnowledgeStore.put(best);
    return best;
  }

  function buildKeywords(question, old) {
    const set = new Set(old || []);
    const q = String(question || '').trim();
    if (q) set.add(q.slice(0, 30));
    const c = core(q);
    if (c && c.length >= 2) set.add(c);
    q.split(/[\s,，。？?！!、；;：:]+/)
      .filter((t) => t.length >= 2)
      .slice(0, 4)
      .forEach((t) => set.add(t));
    return [...set].slice(0, 10);
  }

  function trim() {
    if (cache.length <= MAX_ENTRIES) return;
    const sorted = [...cache].sort(
      (a, b) =>
        (a.pinned ? 1 : 0) - (b.pinned ? 1 : 0) ||
        (a.lastUsedAt || a.updatedAt || 0) - (b.lastUsedAt || b.updatedAt || 0)
    );
    const dropIds = sorted.slice(0, cache.length - MAX_ENTRIES).map((item) => item.id);
    cache = cache.filter((item) => dropIds.indexOf(item.id) === -1);
    dropIds.forEach((id) => KnowledgeStore.remove(id));
  }

  async function saveLearned({ subject, question, answer, source, sourceUrl, title }) {
    const q = String(question || '').trim();
    const text = String(answer || '').trim();
    if (!subject || !q || text.length < 20) return null;

    const id = makeId(subject, q);
    const existing = cache.find((item) => item.id === id);
    const now = Date.now();
    const entry = existing
      ? { ...existing }
      : { id, subject, question: q, hits: 0, pinned: false, learnedAt: now };

    entry.title = title || entry.title || q.slice(0, 30);
    entry.answer = text;
    entry.source = source || entry.source || '';
    entry.sourceUrl = sourceUrl || entry.sourceUrl || '';
    entry.keywords = buildKeywords(q, entry.keywords);
    entry.updatedAt = now;
    entry.auto = true;

    cache = cache.filter((item) => item.id !== id);
    cache.push(entry);
    sortCache();
    trim();
    await KnowledgeStore.put(entry);
    return entry;
  }

  async function remove(id) {
    cache = cache.filter((item) => item.id !== id);
    await KnowledgeStore.remove(id);
  }

  async function togglePin(id) {
    const entry = cache.find((item) => item.id === id);
    if (!entry) return;
    entry.pinned = !entry.pinned;
    entry.updatedAt = Date.now();
    sortCache();
    await KnowledgeStore.put(entry);
  }

  function count() {
    return cache.length;
  }

  function countBySubject() {
    const map = {};
    cache.forEach((item) => {
      map[item.subject] = (map[item.subject] || 0) + 1;
    });
    return map;
  }

  function search(query) {
    const q = normalize(query);
    if (!q) return cache.slice();
    return cache.filter((item) => {
      const haystack = normalize(
        [item.question, item.title, item.answer.slice(0, 200), (item.keywords || []).join(' ')].join(' ')
      );
      return haystack.indexOf(q) !== -1;
    });
  }

  function exportJSON() {
    return JSON.stringify(
      { app: 'zhixue', version: 1, exportedAt: Date.now(), entries: cache },
      null,
      2
    );
  }

  async function importJSON(text) {
    const data = JSON.parse(text);
    const incoming = Array.isArray(data) ? data : data.entries || [];
    let added = 0;
    let updated = 0;

    for (const raw of incoming) {
      if (!isValid(raw)) continue;
      const entry = sanitize(raw);
      entry.id = entry.id || makeId(entry.subject, entry.question || entry.title);
      entry.updatedAt = entry.updatedAt || Date.now();

      const old = cache.find((item) => item.id === entry.id);
      if (old) {
        if ((entry.updatedAt || 0) < (old.updatedAt || 0)) continue;
        updated += 1;
      } else {
        added += 1;
      }

      cache = cache.filter((item) => item.id !== entry.id);
      cache.push(entry);
      await KnowledgeStore.put(entry);
    }

    sortCache();
    trim();
    return { added, updated };
  }

  return {
    init,
    list,
    find,
    saveLearned,
    remove,
    togglePin,
    count,
    countBySubject,
    search,
    exportJSON,
    importJSON,
    get ready() {
      return readyPromise;
    }
  };
})();

// 暴露到全局，便于其它脚本与控制台调试
if (typeof window !== 'undefined') {
  window.Knowledge = Knowledge;
}

</script>
<script>
/**
 * 共享知识库客户端：与后端 /api/knowledge 通信。
 * 自动探测可用的后端地址（同源 → 3000 端口 → 配置地址），
 * 后端不可用时自动降级，不影响本地题库与本地知识库。
 */
(function (global) {
  'use strict';

  const TOKEN_KEY = 'zhixue_shared_tokens';
  const CACHE_TTL = 60 * 1000;
  const HEALTH_TIMEOUT = 1500;

  let items = [];
  let loadedAt = 0;
  let loading = null;
  let lastError = '';
  let resolvedBase = null;
  let baseResolved = false;

  function configuredBase() {
    const configured =
      (typeof global.SHARE_CONFIG !== 'undefined' && global.SHARE_CONFIG.apiBase) || '';
    return String(configured).replace(/\/+$/, '');
  }

  function candidates() {
    const list = [];
    const configured = configuredBase();
    if (configured) list.push(configured);

    const loc = global.location;
    if (loc && loc.protocol !== 'file:') {
      // 同源：前后端一起部署（node server.js / 反向代理）时最可靠
      list.push('');
    }
    const host = (loc && loc.hostname) || 'localhost';
    list.push(`http://${host}:3000`);
    if (host !== 'localhost' && host !== '127.0.0.1') {
      list.push('http://localhost:3000');
    }
    return Array.from(new Set(list));
  }

  async function tryHealth(base) {
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => {
      if (controller) controller.abort();
    }, HEALTH_TIMEOUT);
    try {
      const resp = await fetch(`${base}/api/health`, {
        cache: 'no-store',
        signal: controller ? controller.signal : undefined
      });
      if (!resp.ok) return false;
      const data = await resp.json().catch(() => null);
      return Boolean(data && data.ok);
    } catch {
      return false;
    } finally {
      clearTimeout(timer);
    }
  }

  async function resolveBase(force) {
    if (baseResolved && !force) return resolvedBase;
    const list = candidates();
    for (const base of list) {
      // eslint-disable-next-line no-await-in-loop
      if (await tryHealth(base)) {
        resolvedBase = base;
        baseResolved = true;
        return base;
      }
    }
    resolvedBase = null;
    baseResolved = true;
    return null;
  }

  function tokenMap() {
    try {
      const parsed = JSON.parse(global.localStorage.getItem(TOKEN_KEY) || '{}');
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch {
      return {};
    }
  }

  function saveToken(id, token) {
    if (!id || !token) return;
    const map = tokenMap();
    map[id] = token;
    try {
      global.localStorage.setItem(TOKEN_KEY, JSON.stringify(map));
    } catch {
      /* 忽略存储失败 */
    }
  }

  function dropToken(id) {
    const map = tokenMap();
    delete map[id];
    try {
      global.localStorage.setItem(TOKEN_KEY, JSON.stringify(map));
    } catch {
      /* 忽略存储失败 */
    }
  }

  async function request(path, options = {}) {
    const base = await resolveBase(Boolean(options.forceBase));
    if (base === null) {
      const err = new Error('连不上共享服务');
      err.code = 'SHARE_UNREACHABLE';
      throw err;
    }

    const timeout = options.timeout || 6000;
    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => {
      if (controller) controller.abort();
    }, timeout);

    try {
      const resp = await fetch(base + path, {
        method: options.method || 'GET',
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        },
        body: options.body,
        signal: controller ? controller.signal : undefined
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(data.error || `请求失败（${resp.status}）`);
      return data;
    } catch (err) {
      if (err && err.code !== 'SHARE_UNREACHABLE' && err.name === 'TypeError') {
        // 网络中断：下次重新探测地址
        baseResolved = false;
      }
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchItems(force) {
    if (loading) return loading;
    if (!force && loadedAt && Date.now() - loadedAt < CACHE_TTL) {
      return { ok: true, items: items.slice(), total: items.length, error: '' };
    }

    loading = request('/api/knowledge', { forceBase: force })
      .then((data) => {
        items = Array.isArray(data.items) ? data.items : [];
        loadedAt = Date.now();
        lastError = '';
        return { ok: true, items: items.slice(), total: data.total || items.length, error: '' };
      })
      .catch((err) => {
        if (err && err.code === 'SHARE_UNREACHABLE') lastError = '连不上共享服务';
        else if (err && err.name === 'AbortError') lastError = '连接共享服务超时';
        else lastError = (err && err.message) || '共享服务异常';
        return { ok: false, items: items.slice(), total: items.length, error: lastError };
      })
      .finally(() => {
        loading = null;
      });

    return loading;
  }

  function normalize(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/[\s，。？！、；：,.?!;:'"“”‘’（）()\[\]【】《》<>·\-—_/\\]/g, '');
  }

  const STOP = /(为什么|是什么|怎么样|怎么|如何|请问|多少|什么|哪些|告诉我|原因|一下|的|了|吗|呢|吧|啊|呀|是|有|和|与|及|请)/g;

  function core(text) {
    return normalize(text).replace(STOP, '');
  }

  function bigramSimilarity(a, b) {
    if (!a || !b) return 0;
    const grams = (text) => {
      const set = new Set();
      for (let i = 0; i < text.length - 1; i += 1) set.add(text.slice(i, i + 2));
      return set;
    };
    const ga = grams(a);
    const gb = grams(b);
    if (!ga.size || !gb.size) return 0;
    let hit = 0;
    ga.forEach((g) => {
      if (gb.has(g)) hit += 1;
    });
    return hit / Math.min(ga.size, gb.size);
  }

  function scoreItem(entry, question) {
    const q = normalize(question);
    const nt = normalize(entry.title);
    const nc = normalize(entry.content);
    const cq = core(question);
    let score = 0;

    if (!q) return 0;
    if (nt === q) score = 10;
    else if (nt.includes(q) || q.includes(nt)) score = 7;
    else if (nc.includes(q)) score = 4;

    if (!score && cq.length >= 2) {
      if (core(entry.title) === cq) score = 8;
      else if (bigramSimilarity(cq, core(entry.title)) >= 0.6) score = 5;
    }
    return score;
  }

  async function find(subjectId, question) {
    if (!question) return null;
    if (!items.length) {
      if (typeof global.navigator !== 'undefined' && !global.navigator.onLine) return null;
      const result = await fetchItems(false);
      if (!result.ok && !items.length) return null;
    }

    let best = null;
    let bestScore = 0;
    items.forEach((entry) => {
      if (entry.subject !== subjectId) return;
      const score = scoreItem(entry, question);
      if (score > bestScore) {
        bestScore = score;
        best = entry;
      }
    });
    return bestScore >= 4 ? best : null;
  }

  async function create(payload) {
    const data = await request('/api/knowledge', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    if (data && data.ok && data.item) {
      saveToken(data.item.id, data.ownerToken);
      items = [data.item].concat(items);
      loadedAt = Date.now();
      return { ok: true, item: data.item };
    }
    return { ok: false, error: '保存失败' };
  }

  async function remove(id) {
    const token = tokenMap()[id];
    if (!token) return { ok: false, error: '只能删除自己添加的内容' };
    await request(`/api/knowledge/${encodeURIComponent(id)}`, {
      method: 'DELETE',
      headers: { 'X-Owner-Token': token }
    });
    items = items.filter((entry) => entry.id !== id);
    dropToken(id);
    return { ok: true };
  }

  function cached(subjectId) {
    return subjectId ? items.filter((entry) => entry.subject === subjectId) : items.slice();
  }

  function get(id) {
    return items.find((entry) => entry.id === id) || null;
  }

  function canDelete(id) {
    return Boolean(tokenMap()[id]);
  }

  function count() {
    return items.length;
  }

  function serverLabel() {
    const base = resolvedBase === null ? (baseResolved ? '未连接' : '探测中') : resolvedBase || '同源服务';
    return base;
  }

  function isLocalPage() {
    const loc = global.location;
    if (!loc) return true;
    return loc.protocol === 'file:' || loc.hostname === 'localhost' || loc.hostname === '127.0.0.1';
  }

  function status() {
    return { loadedAt, error: lastError, base: serverLabel(), local: isLocalPage() };
  }

  global.SharedKnowledge = {
    candidates,
    resolveBase,
    fetchItems,
    find,
    create,
    remove,
    cached,
    get,
    canDelete,
    count,
    status,
    isLocalPage
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

function getPoemById(id) {
  return CHINESE_POEMS.find((poem) => poem.id === id);
}

function normalizeText(text) {
  return text.replace(/[，。！？、；：“”‘’《》\s]/g, '');
}

function findPoemByQuestion(question) {
  const q = normalizeText(question);
  if (!q) return null;

  let best = null;
  let bestScore = 0;
  for (const poem of CHINESE_POEMS) {
    let score = 0;
    const title = normalizeText(poem.title);
    if (q.includes(title)) {
      score += 6;
    } else {
      // 支持"沁园春·雪"这类词牌名 + 题目，只输入其中一部分也能命中
      const parts = title.split(/[·・\s]+/).filter((p) => p.length >= 2);
      if (parts.some((p) => q.includes(p))) score += 4;
    }
    if (q.includes(normalizeText(poem.author))) score += 3;
    if (poem.keywords && poem.keywords.some((k) => q.includes(normalizeText(k)))) score += 4;
    for (const line of poem.poem) {
      if (q.includes(normalizeText(line).slice(0, 4))) score += 2;
    }
    if (score > bestScore) { bestScore = score; best = poem; }
  }
  return bestScore >= 2 ? best : null;
}

function getMathProblemById(id) {
  return MATH_PROBLEMS.find((problem) => problem.id === id);
}

function scoreTopics(topics, question) {
  const q = normalizeText(question).toLowerCase();
  if (!q) return null;

  let best = null;
  let bestScore = 0;
  for (const topic of topics) {
    let score = 0;
    if (topic.keywords) {
      for (const kw of topic.keywords) {
        const nk = normalizeText(kw).toLowerCase();
        if (!nk) continue;
        if (q.includes(nk)) score += nk.length >= 3 ? 3 : nk.length === 2 ? 2 : 1;
      }
    }
    if (topic.question) {
      for (const kw of topic.question) {
        const nk = normalizeText(kw).toLowerCase();
        if (!nk) continue;
        if (q.includes(nk)) score += nk.length >= 3 ? 3 : nk.length === 2 ? 2 : 1;
      }
    }
    if (topic.title && q.includes(normalizeText(topic.title).toLowerCase())) score += 5;
    if (score > bestScore) { bestScore = score; best = topic; }
  }
  return bestScore >= 2 ? best : null;
}

function findMathProblemByQuestion(question) {
  return scoreTopics(MATH_PROBLEMS, question);
}

];

/**
 * 联网搜索：用 DuckDuckGo 官方 Instant Answer API（CORS 友好）拿定义/事实卡片。
 * 返回 { answer, source } 或 null。
 */
async function searchDuckDuckGoInstant(question) {
  try {
    const url =
      'https://api.duckduckgo.com/?q=' +
      encodeURIComponent(question) +
      '&format=json&no_redirect=1&no_html=1&skip_disambig=1';
    const resp = await fetch(url, { signal: AbortSignal.timeout?.(5000) });
    if (!resp.ok) return null;
    const data = await resp.json();

    const parts = [];
    if (data.AbstractText) parts.push(data.AbstractText);
    if (data.Definition) parts.push(data.Definition);
    if (data.RelatedTopics && data.RelatedTopics.length) {
      const rel = data.RelatedTopics
        .map((t) => t.Text)
        .filter(Boolean)
        .slice(0, 3);
      if (rel.length) parts.push(rel.join('；'));
    }

    if (!parts.length) return null;

    const source = data.AbstractSource || data.DefinitionSource || '';
    return {
      answer: parts.join('\n\n'),
      source: source ? `（来源：${source}）` : '（来源：DuckDuckGo）',
      sourceName: source || 'DuckDuckGo',
      sourceUrl: data.AbstractURL || ''
    };
  } catch {
    return null;
  }
}

/**
 * 百度百科（JSONP）：国内网络更容易连上，且不受浏览器跨域限制。
 * 返回词条摘要，作为中文内容的首要来源。
 */
function searchBaike(question) {
  return new Promise((resolve) => {
    if (typeof document === 'undefined') {
      resolve(null);
      return;
    }

    const cbName = 'baikeCb' + Math.random().toString(36).slice(2, 10);
    const script = document.createElement('script');
    let settled = false;

    const cleanup = () => {
      if (script.parentNode) script.parentNode.removeChild(script);
      try {
        delete window[cbName];
      } catch {
        window[cbName] = undefined;
      }
    };

    const finish = (value) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      cleanup();
      resolve(value);
    };

    window[cbName] = (data) => {
      if (!data || !data.abstract) {
        finish(null);
        return;
      }
      finish({
        answer: String(data.abstract).replace(/\s+/g, ' ').trim(),
        source: '（来源：百度百科）',
        sourceName: '百度百科',
        sourceUrl: data.url || `https://baike.baidu.com/item/${encodeURIComponent(question)}`
      });
    };

    const timer = setTimeout(() => finish(null), 3000);
    script.onerror = () => finish(null);
    script.src =
      'https://baike.baidu.com/api/openapi/BaikeLemmaCardApi?scope=103&format=json&appid=379020' +
      `&bk_key=${encodeURIComponent(question)}&bk_length=800&callback=${cbName}`;
    document.head.appendChild(script);
  });
}

/**
 * 联网搜索：用 Wikipedia REST API（CORS 友好）拿百科摘要。
 * 先尝试中文维基，再 fallback 英文。
 */
async function searchWikipedia(question) {
  const tryLang = async (lang) => {
    try {
      const url =
        `https://${lang}.wikipedia.org/api/rest_v1/page/summary/` +
        encodeURIComponent(question);
      const resp = await fetch(url, { signal: AbortSignal.timeout?.(5000) });
      if (!resp.ok) return null;
      const data = await resp.json();
      if (!data.extract) return null;
      return {
        answer: data.extract,
        source: `（来源：${lang === 'zh' ? '中文维基百科' : 'Wikipedia'}）`,
        sourceName: lang === 'zh' ? '中文维基百科' : 'Wikipedia',
        sourceUrl:
          (data.content_urls &&
            data.content_urls.desktop &&
            data.content_urls.desktop.page) ||
          `https://${lang}.wikipedia.org/wiki/${encodeURIComponent(question)}`
      };
    } catch {
      return null;
    }
  };
  return (await tryLang('zh')) || (await tryLang('en'));
}

/**
 * 联网结果质量检查：过滤掉"单个英文单词""乱码""过短"等无效结果。
 */
function isGoodWebAnswer(question, answer) {
  if (!answer) return false;
  const text = String(answer).replace(/\s+/g, ' ').trim();
  if (text.length < 40) return false;

  const hasCJK = /[\u4e00-\u9fa5]/.test(question);
  const cjkCount = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  if (hasCJK) {
    // 中文提问却搜回英文结果，直接丢弃
    if (cjkCount < 15) return false;
    if (cjkCount / text.length < 0.2) return false;
  }

  // 明显乱码：大量替换符或不可读字符
  const bad = (text.match(/[\uFFFD\u0000-\u0008\u000E-\u001F]/g) || []).length;
  if (bad > 0) return false;

  // 纯网址/纯符号
  if (/^[\s\w.:/-]+$/.test(text) && !/[\u4e00-\u9fa5]/.test(text)) return false;

  return true;
}

/**
 * 综合联网搜索：并行调百度百科 + DuckDuckGo + Wikipedia，选质量最好、内容最长的那个。
 * 结果不合格时返回 null，交由本地题库兜底。
 */
async function tryWebSearch(question) {
  try {
    const results = await Promise.all([
      searchBaike(question),
      searchDuckDuckGoInstant(question),
      searchWikipedia(question)
    ]);
    const valid = results
      .filter(Boolean)
      .filter((item) => isGoodWebAnswer(question, item.answer));
    if (!valid.length) return null;
    valid.sort((a, b) => b.answer.length - a.answer.length);
    return valid[0];
  } catch {
    return null;
  }
}

/**
 * 学科问答主函数。
 * 流程：本地题库优先（内容更完整）→ 联网搜索 → 学科专属兜底。
 */
async function askSmartAI(question, subjectId) {
  // 1. 命中本地题库
  if (subjectId === 'chinese') {
    const poem = findPoemByQuestion(question);
    if (poem) return { type: 'poem', poem };
  } else if (subjectId === 'math') {
    const problem = findMathProblemByQuestion(question);
    if (problem) return { type: 'math', problem };
  } else if (subjectId === 'geography') {
    const topic = findGeoTopicByQuestion(question);
    if (topic) return { type: 'geo', topic };
  } else {
    const maps = {
      physics: PHYSICS_TOPICS, chemistry: CHEMISTRY_TOPICS,
      biology: BIOLOGY_TOPICS, english: ENGLISH_TOPICS, history: HISTORY_TOPICS
    };
    if (maps[subjectId]) {
      const topic = findTopicByQuestion(maps[subjectId], question);
      if (topic) return { type: subjectId, topic };
    }
  }

  // 2. 本地知识库（联网时学到的内容，离线同样可用）
  if (typeof Knowledge !== 'undefined' && Knowledge.find) {
    const learned = Knowledge.find(subjectId, question);
    if (learned) {
      return {
        type: 'text',
        answer: learned.answer,
        source: `（来自我的知识库${learned.source ? ' · ' + learned.source : ''}）`,
        learnedFrom: learned.id
      };
    }
  }

  // 3. 共享知识库（多人共建，所有访问者可见；断网时使用已缓存内容）
  if (typeof SharedKnowledge !== 'undefined' && SharedKnowledge.find) {
    try {
      const shared = await SharedKnowledge.find(subjectId, question);
      if (shared) {
        return {
          type: 'text',
          answer: shared.content,
          source: `（来自共享知识库${shared.author ? ' · ' + shared.author : ''}）`,
          learnedFrom: `shared:${shared.id}`
        };
      }
    } catch (err) {
      console.warn('[ai] 共享知识库查询失败：', err);
    }
  }

  // 4. 联网搜索（浏览器能上网才执行，且结果必须通过质量检查）
  const online = typeof navigator !== 'undefined' && navigator.onLine;
  if (online) {
    const web = await tryWebSearch(question);
    if (web) {
      const guide = generateSubjectAugment(question, subjectId, web.answer);
      const answer = guide || web.answer;
      let learned = null;
      if (typeof Knowledge !== 'undefined' && Knowledge.saveLearned) {
        learned = await Knowledge.saveLearned({
          subject: subjectId,
          question,
          answer,
          source: web.sourceName || web.source,
          sourceUrl: web.sourceUrl || ''
        });
      }
      return {
        type: 'text',
        answer,
        source: web.source,
        learned: !!learned
      };
    }
  }

  // 5. 学科专属兜底回答
  return { type: 'text', answer: generateFallback(question, subjectId) };
}

/**

 * 比如搜出来一段关于「牛顿第二定律」的维基摘要，加上物理学习建议。

  const subjectHint = {
    chinese: '语文学习中', math: '数学学习中', english: '英语学习中',

  const addOns = {
    chinese: `\n\n💡 ${subjectHint}的小建议：可以从"主旨情感、语言修辞、背景风格"三个角度来深挖这段内容。`,
    math: `\n\n💡 ${subjectHint}的小建议：试着把这里的关键信息用数学符号写出来，再用"已知→求→解→检验"四步法做一遍。`,
    english: `\n\n💡 ${subjectHint}的小建议：注意里面的核心句式和关键词，自己造一个类似的句子能帮你记得更牢。`,
    physics: `\n\n💡 ${subjectHint}的小建议：这对应哪个物理模型？能写出相关的公式吗？试试改变一个条件，看结论怎么变。`,
    chemistry: `\n\n💡 ${subjectHint}的小建议：把宏观现象和微观本质联系起来——分子/原子层面发生了什么变化？`,

    geography: `\n\n💡 ${subjectHint}的小建议：可以用地理"三板斧"（位置、气候、地形）来分析——它位于哪里？气候怎样？地形如何？`,

  return webAnswer + (addOns[subjectId] || '');
}

/**
 * 远程调用 AI 服务。失败时抛出异常，由 askAI 统一回退。
 */
async function askRemoteAI(question, subjectId) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);

  try {
    const response = await fetch(AI_CONFIG.chatUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        unitId: AI_CONFIG.unitId,
        robotId: AI_CONFIG.robotId,
        question,
        subject: subjectId
      }),
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error(`AI 接口返回 HTTP ${response.status}`);
    }

    const contentType = response.headers.get('content-type') || '';
    if (!contentType.includes('application/json')) {
      throw new Error('AI 接口返回的不是 JSON');
    }

    const data = await response.json();
    const answer =
      data.answer ||
      data.content ||
      data.result ||
      (data.data && (data.data.answer || data.data.content));

    if (typeof answer !== 'string' || !answer.trim()) {
      throw new Error('AI 响应中没有有效回答');
    }

    return { type: 'text', answer };
  } finally {
    clearTimeout(timer);
  }
}

/**
 * 统一 AI 问答入口。
 * 流程：远程智能体（若启用）→ 联网搜索 + 本地硬编码 + 学科兜底。
 */
async function askAI(question, subjectId) {
  const config = typeof AI_CONFIG === 'undefined' ? null : AI_CONFIG;

  // 远程 AI 模式（如果启用且配了 unitId/robotId）
  if (config && config.enabled && config.unitId && config.robotId) {
    try {
      return await askRemoteAI(question, subjectId);
    } catch (error) {
      console.warn('[AI] 远程 AI 失败，切换到联网+本地模式：', error);
      const local = await askSmartAI(question, subjectId);
      return { ...local, notice: '远程 AI 未响应，已切换到联网+本地模式' };
    }
  }

  // 默认：联网优先 + 本地兜底
  return askSmartAI(question, subjectId);
}

const answers = {};

const HISTORY_MAX = 20;
const HISTORY_PREFIX = 'zhixue_history:';

// ---- 历史记录抽屉 ----
let historyDrawerEl = null;
let historyCloseTimer = null;

function getHistory(subjectId) {
  try {
    const raw = localStorage.getItem(HISTORY_PREFIX + subjectId);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed)
      ? parsed.filter((item) => item && typeof item.question === 'string')
      : [];
  } catch {
    return [];
  }
}

function saveHistory(subjectId, question, result) {
  const list = getHistory(subjectId);
  // 去重：同 question 旧记录移走，但保留原来的置顶状态
  const old = list.find((item) => item.question === question);
  const filtered = list.filter((item) => item.question !== question);
  const entry = { question, result, timestamp: Date.now() };
  if (old && old.pinned) entry.pinned = true;
  filtered.unshift(entry);
  const trimmed = filtered.slice(0, HISTORY_MAX);
  try {
    localStorage.setItem(HISTORY_PREFIX + subjectId, JSON.stringify(trimmed));
  } catch {
    // 容量不够就丢最老的继续存
    if (trimmed.length > 1) {
      try {
        localStorage.setItem(
          HISTORY_PREFIX + subjectId,
          JSON.stringify(trimmed.slice(0, trimmed.length - 1))
        );
      } catch {
        // 还是不够就算了
      }
    }
  }
}

function deleteHistoryItem(subjectId, question) {
  const list = getHistory(subjectId).filter((item) => item.question !== question);
  localStorage.setItem(HISTORY_PREFIX + subjectId, JSON.stringify(list));
}

function toggleHistoryPin(subjectId, question) {
  const list = getHistory(subjectId).map((item) =>
    item.question === question ? { ...item, pinned: !item.pinned } : item
  );
  localStorage.setItem(HISTORY_PREFIX + subjectId, JSON.stringify(list));
}

function historyGroupLabel(ts) {
  if (!Number.isFinite(ts)) return '更早';
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if (ts >= startOfToday) return '今天';
  if (ts >= startOfToday - 86400000) return '昨天';
  if (ts >= startOfToday - 6 * 86400000) return '本周';
  return '更早';
}

function clearHistory(subjectId) {
  localStorage.removeItem(HISTORY_PREFIX + subjectId);
}

function relativeTime(ts) {
  if (!Number.isFinite(ts)) return '';
  const diff = (Date.now() - ts) / 1000;
  if (diff < 5) return '刚刚';
  if (diff < 60) return Math.floor(diff) + '秒前';
  if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
  if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
  if (diff < 172800) return '昨天';
  const d = new Date(ts);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function historyItemPreview(result) {
  if (!result || typeof result !== 'object') return String(result || '').slice(0, 30);
  if (result.type === 'poem' && result.poem) return `${result.poem.title} · ${result.poem.author}`;
  if (result.problem && result.problem.brief) return result.problem.brief.slice(0, 30);
  if (result.topic && result.topic.brief) return result.topic.brief.slice(0, 30);
  return (result.answer || '').slice(0, 30);
}

// 兼容旧版本存储格式，无法渲染的记录返回 null
function normalizeStoredResult(subjectId, result) {
  if (typeof result === 'string') {
    return result.trim() ? { type: subjectId, answer: result } : null;
  }
  if (!result || typeof result !== 'object') return null;
  if (result.type === 'poem') {
    return result.poem && Array.isArray(result.poem.poem) ? result : null;
  }
  if (result.type === 'geo' && (!result.topic || !Array.isArray(result.topic.places))) return null;
  if (!result.problem && !result.topic && !result.answer) return null;
  return result;
}

// 把元素内所有 $...$ 包裹的内容用 KaTeX 渲染成真公式
function renderMath(root) {
  if (!root || typeof katex === 'undefined') return;

  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const textNodes = [];
  let node;

  while ((node = walker.nextNode())) {
    if (node.nodeValue.indexOf('$') === -1) continue;
    const parent = node.parentElement;
    if (!parent || parent.closest('script, style, .katex')) continue;
    textNodes.push(node);
  }

  textNodes.forEach((textNode) => {
    const text = textNode.nodeValue;
    const regex = /\$([^$]+)\$/g;
    const fragment = document.createDocumentFragment();
    let lastIndex = 0;
    let match;

    while ((match = regex.exec(text)) !== null) {
      fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));

      const mathEl = document.createElement('span');
      try {
        katex.render(match[1], mathEl, { throwOnError: false });
      } catch {
        mathEl.textContent = match[0];
      }
      fragment.appendChild(mathEl);
      lastIndex = match.index + match[0].length;
    }

    if (lastIndex === 0) return;
    if (lastIndex < text.length) {
      fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
    textNode.parentNode.replaceChild(fragment, textNode);
  });
}

function waitForImage(img) {
  return new Promise((resolve) => {
    if (img.complete && img.naturalWidth) {
      resolve();
      return;
    }
    img.onload = () => resolve();
    img.onerror = () => resolve();
  });
}

/**
 * 本地图片质检：分辨率、亮度、对比度、模糊度（拉普拉斯方差）。
 * 只拦截明显不合格的照片，阈值偏宽松，避免误伤。
 */
function analyzePhoto(img) {
  const width = img.naturalWidth || img.width || 0;
  const height = img.naturalHeight || img.height || 0;
  const issues = [];

  if (!width || !height) return { issues: ['图片无法读取'] };
  if (Math.min(width, height) < 600) issues.push('分辨率偏低');

  const maxSide = 640;
  const scale = Math.min(1, maxSide / Math.max(width, height));
  const w = Math.max(1, Math.round(width * scale));
  const h = Math.max(1, Math.round(height * scale));

  try {
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    if (!ctx) return { issues };
    ctx.drawImage(img, 0, 0, w, h);
    const pixels = ctx.getImageData(0, 0, w, h).data;
    const gray = new Float32Array(w * h);

    let sum = 0;
    for (let i = 0; i < w * h; i += 1) {
      const g = 0.299 * pixels[i * 4] + 0.587 * pixels[i * 4 + 1] + 0.114 * pixels[i * 4 + 2];
      gray[i] = g;
      sum += g;
    }
    const mean = sum / (w * h);

    let variance = 0;
    for (let i = 0; i < w * h; i += 1) variance += (gray[i] - mean) ** 2;
    variance /= w * h;
    const std = Math.sqrt(variance);

    let lapSum = 0;
    let lapSquare = 0;
    let count = 0;
    for (let y = 1; y < h - 1; y += 1) {
      for (let x = 1; x < w - 1; x += 1) {
        const idx = y * w + x;
        const v = 4 * gray[idx] - gray[idx - 1] - gray[idx + 1] - gray[idx - w] - gray[idx + w];
        lapSum += v;
        lapSquare += v * v;
        count += 1;
      }
    }
    const lapVar = count ? lapSquare / count - (lapSum / count) ** 2 : 0;

    if (mean < 45) issues.push('画面太暗');
    else if (mean > 228) issues.push('画面过曝');
    if (std < 16) issues.push('对比度太低');
    if (lapVar < 60) issues.push('照片偏模糊');

    return { issues, mean, std, lapVar };
  } catch {
    return { issues };
  }
}

let tesseractLoading = null;

function loadTesseractScript() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractLoading) return tesseractLoading;

  tesseractLoading = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.async = true;
    const timer = setTimeout(() => reject(new Error('识别引擎加载超时，请检查网络')), 30000);
    script.onload = () => {
      clearTimeout(timer);
      if (window.Tesseract) resolve();
      else reject(new Error('识别引擎加载失败'));
    };
    script.onerror = () => {
      clearTimeout(timer);
      reject(new Error('识别引擎加载失败，请检查网络'));
    };
    document.head.appendChild(script);
  }).catch((err) => {
    tesseractLoading = null;
    throw err;
  });

  return tesseractLoading;
}

function guessSubjectFromText(text) {
  const source = String(text || '');
  if (!source) return '';
  let bestId = '';
  let bestScore = 0;

  SUBJECTS.forEach((subject) => {
    let score = 0;
    (getSubjectBank(subject.id) || []).forEach((item) => {
      const words = [item.title, ...(item.keywords || [])].filter(Boolean);
      words.forEach((word) => {
        const w = String(word).trim();
        if (w.length >= 2 && source.includes(w)) score += w.length >= 4 ? 2 : 1;
      });
    });
    if (score > bestScore) {
      bestScore = score;
      bestId = subject.id;
    }
  });

  return bestScore >= 2 ? bestId : '';
}

    quizRows.length = 0;
    generated.forEach((row) => quizRows.push({ ...row }));
    renderQuizRows();
    setStatus(`已生成 ${generated.length} 道题，可以直接修改`, 'ok');
  });

  function close() {
    closeAddEntryModal();
  }

  modal.querySelector('.entry-close').addEventListener('click', close);
  modal.querySelector('#entry-cancel').addEventListener('click', close);
  modal.querySelector('.entry-mask').addEventListener('click', close);

  const onKey = (e) => {
    if (e.key === 'Escape') close();
  };
  document.addEventListener('keydown', onKey);
  addModalCleanup = () => document.removeEventListener('keydown', onKey);

  document.querySelectorAll('.entry-tab').forEach((tab) => {
    tab.addEventListener('click', () => {
      state.mode = tab.dataset.mode;
      document.querySelectorAll('.entry-tab').forEach((t) => {
        const active = t === tab;
        t.classList.toggle('is-active', active);
        t.setAttribute('aria-selected', String(active));
      });
      photoBox.hidden = state.mode !== 'photo';
      contentInput.placeholder =
        state.mode === 'photo'
          ? '识别出的文字会填到这里，也可以直接手动修改'
          : '输入要分享的学习内容，识别结果也会填到这里';
      setStatus('');
    });
  });

  photoPick.addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', async () => {
    const file = photoInput.files && photoInput.files[0];
    if (!file) return;
    setStatus('正在检查图片…', 'busy');
    try {
      state.dataUrl = await readFileAsDataURL(file);
      preview.hidden = false;
      previewImg.src = state.dataUrl;
      await waitForImage(previewImg);
      photoName.textContent = file.name || '已选择图片';

      const report = analyzePhoto(previewImg);
      state.issues = report.issues || [];
      ocrBtn.hidden = false;

      if (state.issues.length) {
        ocrBtn.textContent = '仍要尝试识别';
        setStatus(`⚠ ${state.issues.join('、')}，建议重拍，或改用手动输入。`, 'warn');
      } else {
        ocrBtn.textContent = '开始识别';
        setStatus('✓ 图片清晰度基本合格，可以开始识别', 'ok');
      }
    } catch (err) {
      setStatus(err.message || '读取图片失败，请重试', 'error');
    } finally {
      photoInput.value = '';
    }
  });

  ocrBtn.addEventListener('click', async () => {
    if (!state.dataUrl || state.busy) return;
    state.busy = true;
    ocrBtn.disabled = true;
    photoPick.disabled = true;
    saveBtn.disabled = true;
    setStatus('正在加载识别引擎…首次使用需联网下载中文模型（约 15MB）', 'busy');

    let worker = null;
    try {
      await loadTesseractScript();
      worker = await window.Tesseract.createWorker('chi_sim+eng', 1, {
        logger: (msg) => {
          if (msg && typeof msg.progress === 'number') {
            setStatus(`正在识别… ${Math.round(msg.progress * 100)}%`, 'busy');
          }
        }
      });
      const { data } = await worker.recognize(state.dataUrl);
      const text = String((data && data.text) || '')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
      const confidence = Math.round((data && data.confidence) || 0);

      if (text.replace(/\s/g, '').length < 20) {
        setStatus('没有识别到足够文字。请重拍（对准文字、拿稳、光线均匀）或改用手动输入。', 'error');
        return;
      }

      if (contentInput.value.trim() && !confirm('识别结果将覆盖当前内容，是否继续？')) {
        return;
      }

      contentInput.value = text;

      if (!titleInput.value.trim()) {
        const firstLine =
          text.split('\n').map((line) => line.trim()).find((line) => line.length >= 2) || text;
        titleInput.value = firstLine.slice(0, 30);
      }

      const guessed = guessSubjectFromText(text);
      if (guessed) {
        subjectSelect.value = guessed;
        const name = (SUBJECTS.find((s) => s.id === guessed) || {}).name || '';
        setStatus(
          `识别完成（置信度 ${confidence}%），已推测学科：${name}。请核对内容后发布。`,
          confidence >= 55 ? 'ok' : 'warn'
        );
      } else {
        setStatus(
          `识别完成（置信度 ${confidence}%），请核对内容、选择学科后发布。`,
          confidence >= 55 ? 'ok' : 'warn'
        );
      }
      photoName.textContent = '识别完成';
    } catch (err) {
      setStatus(`识别失败：${err.message || '请检查网络后重试'}。可改用手动输入。`, 'error');
    } finally {
      if (worker) {
        try {
          await worker.terminate();
        } catch {
          /* 忽略终止异常 */
        }
      }
      state.busy = false;
      ocrBtn.disabled = false;
      photoPick.disabled = false;
      saveBtn.disabled = false;
    }
  });

  saveBtn.addEventListener('click', async () => {
    const subject = subjectSelect.value;
    const title = titleInput.value.trim();
    const content = contentInput.value.trim();
    const author = authorInput.value.trim();
    const incomplete = quizRows.some(
      (row) => Boolean(String(row.q || '').trim()) !== Boolean(String(row.a || '').trim())
    );
    const quiz = quizRows
      .map((row) => ({
        type: row.type === 'short' ? 'short' : 'fill',
        q: String(row.q || '').trim(),
        a: String(row.a || '').trim()
      }))
      .filter((row) => row.q && row.a)
      .slice(0, 8);

    if (!title) {
      titleInput.focus();
      setStatus('请填写标题', 'error');
      return;
    }
    if (content.length < 5) {
      contentInput.focus();
      setStatus('内容至少 5 个字', 'error');
      return;
    }
    if (incomplete) {
      setStatus('有的题只填了题干或答案，请补全或删掉这道题', 'error');
      return;
    }
    if (typeof SharedKnowledge === 'undefined') {
      setStatus('共享服务未加载，无法发布', 'error');
      return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = '发布中…';
    try {
      const result = await SharedKnowledge.create({
        subject,
        title,
        content,
        author,
        source: state.source || (state.mode === 'photo' ? '拍照识别' : '手动录入'),
        quiz
      });
      if (!result.ok) throw new Error(result.error || '发布失败');

      // 发布者本机也存一份，断网后自己仍能查到
      if (typeof Knowledge !== 'undefined' && Knowledge.saveLearned) {
        try {
          await Knowledge.saveLearned({
            subject,
            question: title,
            answer: content,
            source: '共享知识库'
          });
        } catch {
          /* 本地保存失败不影响发布 */
        }
      }

      close();
      if (typeof onSaved === 'function') onSaved();
      alert('已发布到共享知识库，其他人现在也能看到。');
    } catch (err) {
      saveBtn.disabled = false;
      saveBtn.textContent = '发布到共享知识库';
      setStatus(`发布失败：${err.message || '无法连接共享服务器'}`, 'error');
    }
  });
}

/**
 * 练习弹窗：逐题作答 → 看答案 → 自评对错 → 统计结果。
 */
function openPracticeModal(entry) {
  const quiz = (Array.isArray(entry.quiz) ? entry.quiz : []).filter((q) => q && q.q && q.a);
  if (!quiz.length) return;

  const modal = document.createElement('div');
  modal.className = 'entry-modal practice-modal';
  modal.innerHTML = `
    <div class="entry-mask" data-close="1"></div>
    <div class="entry-panel practice-panel" role="dialog" aria-modal="true" aria-label="练习题">
      <header class="entry-head">
        <h2>练习题</h2>
        <button class="entry-close" type="button" aria-label="关闭">×</button>
      </header>
      <div class="entry-body practice-body" id="practice-body"></div>
      <footer class="entry-actions">
        <span id="practice-progress" class="practice-progress"></span>
        <button id="practice-close" class="ghost-btn" type="button">关闭</button>
      </footer>
    </div>
  `;
  document.body.appendChild(modal);
  document.body.classList.add('modal-open');

  const bodyEl = modal.querySelector('#practice-body');
  const progressEl = modal.querySelector('#practice-progress');
  let index = 0;
  let right = 0;

  const onKey = (e) => {
    if (e.key === 'Escape') close();
  };
  const close = () => {
    modal.remove();
    if (!document.querySelector('.entry-modal')) document.body.classList.remove('modal-open');
    document.removeEventListener('keydown', onKey);
  };

  function renderQuestion() {
    bodyEl.innerHTML = '';

    if (index >= quiz.length) {
      progressEl.textContent = `答对 ${right} / ${quiz.length} 题`;
      const done = document.createElement('p');
      done.className = 'practice-done';
      done.textContent = `练习完成！你答对了 ${right} / ${quiz.length} 题。`;
      const again = document.createElement('button');
      again.type = 'button';
      again.className = 'ghost-btn is-primary';
      again.textContent = '再练一次';
      again.addEventListener('click', () => {
        index = 0;
        right = 0;
        renderQuestion();
      });
      bodyEl.appendChild(done);
      bodyEl.appendChild(again);
      return;
    }

    progressEl.textContent = `第 ${index + 1} / ${quiz.length} 题`;
    const item = quiz[index];

    const meta = document.createElement('p');
    meta.className = 'practice-meta';
    meta.textContent = item.type === 'short' ? '简答题' : '填空题';

    const question = document.createElement('p');
    question.className = 'practice-question';
    question.textContent = item.q;

    const input = document.createElement(item.type === 'short' ? 'textarea' : 'input');
    if (input.tagName === 'TEXTAREA') input.rows = 3;
    input.className = 'practice-input';
    input.placeholder = '在这里写你的答案，不会上传';

    const actions = document.createElement('div');
    actions.className = 'practice-actions';
    const showBtn = document.createElement('button');
    showBtn.type = 'button';
    showBtn.className = 'ghost-btn is-primary';
    showBtn.textContent = '看答案';
    actions.appendChild(showBtn);

    const answerBox = document.createElement('div');
    answerBox.className = 'practice-answer-box';
    answerBox.hidden = true;

    const answerLabel = document.createElement('p');
    answerLabel.className = 'practice-answer-label';
    answerLabel.textContent = '参考答案';
    const answerText = document.createElement('p');
    answerText.className = 'practice-answer';
    answerText.textContent = item.a;

    const judge = document.createElement('div');
    judge.className = 'practice-actions';
    const rightBtn = document.createElement('button');
    rightBtn.type = 'button';
    rightBtn.className = 'ghost-btn is-primary';
    rightBtn.textContent = '我答对了';
    const wrongBtn = document.createElement('button');
    wrongBtn.type = 'button';
    wrongBtn.className = 'ghost-btn';
    wrongBtn.textContent = '没答对';
    judge.appendChild(rightBtn);
    judge.appendChild(wrongBtn);

    answerBox.appendChild(answerLabel);
    answerBox.appendChild(answerText);
    answerBox.appendChild(judge);

    showBtn.addEventListener('click', () => {
      answerBox.hidden = false;
      showBtn.hidden = true;
      input.disabled = true;
      rightBtn.focus();
    });
    rightBtn.addEventListener('click', () => {
      right += 1;
      index += 1;
      renderQuestion();
    });
    wrongBtn.addEventListener('click', () => {
      index += 1;
      renderQuestion();
    });

    bodyEl.appendChild(meta);
    bodyEl.appendChild(question);
    bodyEl.appendChild(input);
    bodyEl.appendChild(actions);
    bodyEl.appendChild(answerBox);
    input.focus();
  }

  modal.querySelector('.entry-close').addEventListener('click', close);
  modal.querySelector('#practice-close').addEventListener('click', close);
  modal.querySelector('.entry-mask').addEventListener('click', close);
  document.addEventListener('keydown', onKey);

  renderQuestion();
}

function escapeHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ---- Web Speech API ----
let ttsUtterance = null;
let ttsSpeaking = false;

function stopTTS() {
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.cancel();
  }
  ttsSpeaking = false;
}

function speakText(text, onEnd) {
  if (typeof speechSynthesis === 'undefined') {
    return false;
  }
  stopTTS();
  ttsUtterance = new SpeechSynthesisUtterance(text);
  ttsUtterance.lang = 'zh-CN';
  ttsUtterance.rate = 0.95;
  ttsUtterance.onend = () => {
    ttsSpeaking = false;
    if (onEnd) onEnd();
  };
  ttsUtterance.onerror = () => {
    ttsSpeaking = false;
    if (onEnd) onEnd();
  };
  speechSynthesis.speak(ttsUtterance);
  ttsSpeaking = true;
  return true;
}

function bindPoemAudio(answerBody, poem) {
  const btn = answerBody.querySelector('.poem-read-btn');

    const poemText = poem.poem.join('');

      });

  }
}

function renderAnswer(answerBody, result) {
  answerBody.classList.remove('muted', 'poem-answer', 'is-dictation');

  if (result.type === 'poem') {
    const poem = result.poem;
    answerBody.classList.add('poem-answer');

}

/**
 * 根据一段学习内容自动生成练习题（填空 / 简答），不需要联网或 AI 接口。
 * 规则：标题填空 → 数字填空 → 定义式简答 → 公式填空，去重后最多 4 道。
 */
function generateQuiz(title, content) {
  const text = String(content || '').replace(/\r\n?/g, '\n').trim();
  if (text.length < 12) return [];

  const sentences = text
    .split(/[。！？!?；;\n]+/)
    .map((s) => s.trim())
    .filter((s) => s.length >= 6);

  const out = [];
  const seen = new Set();
  const push = (type, q, a) => {
    const question = String(q || '').trim();
    const answer = String(a || '').trim();
    if (!question || !answer) return;
    const key = question.replace(/\s/g, '');
    if (seen.has(key)) return;
    seen.add(key);
    out.push({ type, q: question, a: answer });
  };

  const cleanTitle = String(title || '').trim();
  if (cleanTitle.length >= 2 && cleanTitle.length <= 20) {
    const hit = sentences.find(
      (s) => s.includes(cleanTitle) && s.length > cleanTitle.length + 4
    );
    if (hit) push('fill', `填空：${hit.replace(cleanTitle, '____')}`, cleanTitle);
  }

  if (out.length < 3) {
    for (const s of sentences) {
      const match = s.match(
        /\d+(?:\.\d+)?\s*(?:%|℃|°C|km\/s|km|m\/s|kg|mol|mL|L|m|g|s|元|年|个|种|次|倍)?/
      );
      if (!match) continue;
      const token = match[0].trim();
      const blanked = s.replace(token, '____');
      if (token.length < 1 || !blanked.includes('____')) continue;
      push('fill', `填空：${blanked}`, token);
      break;
    }
  }

  if (out.length < 3) {
    for (const s of sentences) {
      const match = s.match(/^(.{2,20}?)(?:是|指|称为|叫做|被誉为)(.{4,})$/);
      if (!match) continue;
      const term = match[1].replace(/^(?:所谓|其中|它|这|那|其)/, '').trim();
      if (term.length < 2 || /^(?:什么|怎么|如何|我们|他们|人们)$/.test(term)) continue;
      push('short', `简答：什么是「${term}」？`, s);
      break;
    }
  }

  if (out.length < 3) {
    const formula = text.match(/\$([^$]{2,40})\$/);
    if (formula) push('fill', '填空：请写出文中出现的公式 ____', formula[1].trim());
  }

  return out.slice(0, 4);
}

/**
 * 把当前回答一键分享到共享知识库（预填标题、内容和自动生成的练习题）。
 */
function addShareButton(answerBody, result) {
  const text = result.answer || '';
  const from = String(result.learnedFrom || '');
  if (!text || from.indexOf('shared:') === 0) return;

  const subjectId = (location.hash.match(/^#\/subject\/([^/]+)/) || [])[1] || '';
  if (!subjectId) return;

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'share-answer-btn';
  btn.textContent = '分享到共享知识库';
  btn.addEventListener('click', () => {
    const saved = answers[subjectId];
    const question = (saved && saved.question) || '';
    const fallbackTitle = text.replace(/\s+/g, ' ').trim().slice(0, 30);
    const title = (question || fallbackTitle).slice(0, 60);
    openAddEntryModal(
      () => {},
      {
        subject: subjectId,
        title,
        content: text,
        source: 'AI 学习助手',
        quiz: generateQuiz(title, text)
      }
    );
  });
  answerBody.appendChild(btn);
}

function addRelated(answerBody, result) {
  const related =
    (result.poem && result.poem.related) ||
    (result.problem && result.problem.related) ||
    (result.topic && result.topic.related) ||
    [];
  if (!related.length) return;

  const wrap = document.createElement('div');
  wrap.className = 'related-block';
  wrap.innerHTML = `<span class="related-label">相关学科</span>`;
  related.forEach((item) => {
    const name = (SUBJECTS.find((s) => s.id === item.subject) || {}).name || item.subject;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'related-chip';
    btn.textContent = `${name} · ${item.keyword}`;
    btn.addEventListener('click', () => {
      pendingQuestion = { subjectId: item.subject, text: item.keyword };
      location.hash = `#/subject/${item.subject}`;
    });
    wrap.appendChild(btn);
  });
  answerBody.appendChild(wrap);
}
